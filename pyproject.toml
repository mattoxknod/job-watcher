[project]
name = "job-watcher"
version = "0.1.0"
description = "Daily watcher for analyst and early-career finance job postings"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobwatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
