<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse · Job Watcher</title>
<meta name="description" content="Every open posting, filtered by employer, location and how long it has been open.">
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="2" y="11" width="3.4" height="7" rx="1.3" fill="#2a78d6"/>
        <rect x="8.3" y="6" width="3.4" height="12" rx="1.3" fill="#2a78d6"/>
        <rect x="14.6" y="2" width="3.4" height="16" rx="1.3" fill="#eb6834"/>
      </svg>
      Job Watcher
    </span>
    <nav class="nav">
      <a href="index.html">Today</a>
      <a href="browse.html">Browse</a>
      <a href="market.html">Market</a>
    </nav>
    <span class="offline-flag">Offline — showing last loaded data</span>
  </div>
</header>

<main>
  <h1>Browse</h1>
  <p class="sub" id="asof">Loading…</p>

  <div id="controls" hidden>
    <div class="controls">
      <div class="field">
        <label for="scope">Show</label>
        <div class="segmented" id="scope" role="group" aria-label="Which postings to show">
          <button type="button" data-scope="role" aria-pressed="true">In my role</button>
          <button type="button" data-scope="all" aria-pressed="false">All postings</button>
        </div>
      </div>
      <div class="field">
        <label for="q">Search titles</label>
        <input type="search" id="q" placeholder="analyst, credit, FP&amp;A…" autocomplete="off">
      </div>
      <div class="field">
        <label for="employer">Employer</label>
        <select id="employer"><option value="">All employers</option></select>
      </div>
      <div class="field">
        <label for="region">Region</label>
        <select id="region">
          <option value="">All regions</option>
          <option value="__primary__">★ My primary regions</option>
        </select>
      </div>
      <div class="field">
        <label for="location">Location</label>
        <select id="location"><option value="">All locations</option></select>
      </div>
      <div class="field">
        <label for="days">Days open</label>
        <select id="days">
          <option value="">Any</option>
          <option value="0-7">7 days or less</option>
          <option value="8-30">8 to 30 days</option>
          <option value="31-9999">31 days or more</option>
        </select>
      </div>
      <div class="field">
        <label for="sort">Sort by first seen</label>
        <select id="sort">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </div>
      <div class="field">
        <label for="starred">Shortlist</label>
        <div class="segmented" id="starred" role="group" aria-label="Shortlist filter">
          <button type="button" data-starred="0" aria-pressed="true">Everything</button>
          <button type="button" data-starred="1" aria-pressed="false">Starred only</button>
        </div>
      </div>
    </div>
    <p class="count-line" id="count"></p>
  </div>

  <div id="page">
    <p class="loading">Loading the history file…</p>
  </div>
</main>

<footer>
  The star saves a posting to a shortlist kept in this browser, so it is still
  there after a reload.
</footer>

<script type="module">
import {
  loadData, initChrome, showError, formatDate, lastRunDate, isOpen, daysOpen,
} from "./assets/data.js";
import { esc } from "./assets/charts.js";

initChrome();

const page = document.getElementById("page");
const controls = document.getElementById("controls");
const asof = document.getElementById("asof");

/* ---- shortlist, kept in this browser -------------------------------- */

const STORE = "jobwatcher.shortlist";

// Kept in step with jobwatcher/region.py, which writes the region column.
const PRIMARY_REGIONS = ["Northwest Arkansas", "Little Rock", "Dallas-Fort Worth"];
const PRIMARY_KEY = "__primary__";

function readShortlist() {
  try {
    const raw = localStorage.getItem(STORE);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch {
    // Private windows and blocked site data both land here. The page still
    // works; the shortlist just will not persist.
    return new Set();
  }
}

function writeShortlist(set) {
  try {
    localStorage.setItem(STORE, JSON.stringify([...set]));
  } catch {
    /* Nothing to do: the page keeps working without a saved shortlist. */
  }
}

const shortlist = readShortlist();

/* ---- rendering ------------------------------------------------------- */

const state = { scope: "role", q: "", employer: "", region: "", location: "", days: "", sort: "desc", starred: false };

let open = [];
let runDate = "";

const DAY_BUCKETS = {
  "0-7": [0, 7],
  "8-30": [8, 30],
  "31-9999": [31, Infinity],
};

function matches(row) {
  if (state.scope === "role" && !row.in_role) return false;
  if (state.starred && !shortlist.has(row.posting_id)) return false;
  if (state.employer && row.employer !== state.employer) return false;
  if (state.region === PRIMARY_KEY) {
    if (!PRIMARY_REGIONS.includes(row.region)) return false;
  } else if (state.region && row.region !== state.region) return false;
  if (state.location && row.location !== state.location) return false;
  if (state.q && !row.title.toLowerCase().includes(state.q)) return false;
  if (state.days) {
    const [lo, hi] = DAY_BUCKETS[state.days];
    const d = daysOpen(row, runDate);
    if (d === null || d < lo || d > hi) return false;
  }
  return true;
}

function postingItem(row) {
  const days = daysOpen(row, runDate);
  const starred = shortlist.has(row.posting_id);
  const meta = [
    row.employer,
    row.location,
    row.region && row.region !== row.location ? row.region : "",
    row.department,
    `First seen ${formatDate(row.first_seen)}`,
    days === null ? "" : `${days} ${days === 1 ? "day" : "days"} open`,
    row.first_run ? "Open before watching began" : "",
  ]
    .filter(Boolean)
    .map((part) => `<span>${esc(part)}</span>`)
    .join("");

  return `
    <li class="posting">
      <button class="star" type="button" aria-pressed="${starred}"
              data-id="${esc(row.posting_id)}"
              aria-label="${starred ? "Remove from" : "Add to"} shortlist">${starred ? "★" : "☆"}</button>
      <div class="body">
        <a class="title" href="${esc(row.url)}" target="_blank" rel="noopener">${esc(row.title || "(untitled)")}</a>
        <div class="meta">${meta}</div>
      </div>
      ${row.in_role ? '<span class="pill role">In role</span>' : ""}
      <a class="apply" href="${esc(row.url)}" target="_blank" rel="noopener">Apply</a>
    </li>`;
}

function render() {
  const rows = open.filter(matches);
  const direction = state.sort === "asc" ? 1 : -1;
  rows.sort(
    (a, b) =>
      direction * a.first_seen.localeCompare(b.first_seen) ||
      a.employer.localeCompare(b.employer) ||
      a.title.localeCompare(b.title),
  );

  document.getElementById("count").textContent =
    `${rows.length.toLocaleString()} of ${open.length.toLocaleString()} open postings` +
    (shortlist.size ? ` · ${shortlist.size} starred` : "");

  page.innerHTML = rows.length
    ? `<section class="card"><ul class="postings">${rows.map(postingItem).join("")}</ul></section>`
    : `<section class="card"><p class="empty">Nothing matches these filters.</p></section>`;
}

/* ---- wiring ---------------------------------------------------------- */

function fillSelect(id, values) {
  const select = document.getElementById(id);
  for (const { label, value } of values) {
    const option = document.createElement("option");
    option.value = label;
    option.textContent = `${label} (${value})`;
    select.append(option);
  }
}

// One delegated listener covers every star, including re-rendered ones.
page.addEventListener("click", (event) => {
  const button = event.target.closest(".star");
  if (!button) return;
  const id = button.dataset.id;
  if (shortlist.has(id)) shortlist.delete(id);
  else shortlist.add(id);
  writeShortlist(shortlist);
  render();
});

function segmented(id, apply) {
  const group = document.getElementById(id);
  group.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    group.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b === button));
    });
    apply(button);
    render();
  });
}

try {
  const { history } = await loadData();
  runDate = lastRunDate(history);
  open = history.filter(isOpen);

  asof.textContent =
    `${open.length.toLocaleString()} open postings as of the run on ${formatDate(runDate)}.`;

  const counts = (key) => {
    const map = new Map();
    for (const row of open) {
      const value = row[key];
      if (value) map.set(value, (map.get(value) || 0) + 1);
    }
    return [...map.entries()]
      .map(([label, value]) => ({ label, value }))
      .sort((a, b) => b.value - a.value || a.label.localeCompare(b.label));
  };

  fillSelect("employer", counts("employer"));

  // Regions: the three primary ones first and always listed, even at zero, so
  // it is obvious when nothing is open there rather than the option vanishing.
  const regionCounts = new Map(counts("region").map((d) => [d.label, d.value]));
  const regionSelect = document.getElementById("region");
  for (const name of PRIMARY_REGIONS) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = `★ ${name} (${regionCounts.get(name) || 0})`;
    regionSelect.append(option);
    regionCounts.delete(name);
  }
  const divider = document.createElement("option");
  divider.disabled = true;
  divider.textContent = "──────────";
  regionSelect.append(divider);
  fillSelect("region", [...regionCounts.entries()]
    .map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value || a.label.localeCompare(b.label)));

  fillSelect("location", counts("location"));

  segmented("scope", (b) => { state.scope = b.dataset.scope; });
  segmented("starred", (b) => { state.starred = b.dataset.starred === "1"; });

  document.getElementById("q").addEventListener("input", (e) => {
    state.q = e.target.value.trim().toLowerCase();
    render();
  });
  for (const id of ["employer", "region", "location", "days", "sort"]) {
    document.getElementById(id).addEventListener("change", (e) => {
      state[id] = e.target.value;
      render();
    });
  }

  controls.hidden = false;
  render();
} catch (error) {
  asof.textContent = "";
  showError(page, error);
}
</script>

</body>
</html>
